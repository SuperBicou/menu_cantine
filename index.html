<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Comparateur des menus</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

<div class="container">

    <!-- =============================
         EN-TÊTE
    ============================== -->

    <header class="page-header">

        <h1>Menus du jour</h1>

        <div class="navigation-date">

            <button
                id="date-precedente"
                class="bouton-date"
                type="button"
                aria-label="Jour précédent"
                title="Jour précédent"
            >
                ‹
            </button>


            <div
                id="date-selection"
                class="date-selection"
                title="Choisir une date"
            >
                <div
                    id="date-affichee"
                    class="date"
                ></div>
            </div>


            <button
                id="date-suivante"
                class="bouton-date"
                type="button"
                aria-label="Jour suivant"
                title="Jour suivant"
            >
                ›
            </button>

        </div>

    </header>


    <!-- =============================
         TABLEAU
    ============================== -->

    <div class="table-scroll">

        <div
            id="table-inner"
            class="table-inner"
        >

            <div
                id="restaurants"
                class="restaurants"
            ></div>


            <div id="chargement">
                Chargement des menus...
            </div>


            <main id="menus"></main>

        </div>

    </div>

</div>



<!-- =============================
     CALENDRIER PERSONNALISÉ
============================== -->

<div
    id="calendrier"
    class="calendrier"
    aria-hidden="true"
>

    <div class="calendrier-entete">

        <button
            id="mois-precedent"
            class="bouton-mois"
            type="button"
        >
            ‹
        </button>


        <div
            id="titre-mois"
            class="titre-mois"
        ></div>


        <button
            id="mois-suivant"
            class="bouton-mois"
            type="button"
        >
            ›
        </button>

    </div>


    <div class="jours-semaine">

        <div>lun.</div>
        <div>mar.</div>
        <div>mer.</div>
        <div>jeu.</div>
        <div>ven.</div>
        <div class="weekend">sam.</div>
        <div class="weekend">dim.</div>

    </div>


    <div
        id="jours-calendrier"
        class="jours-calendrier"
    ></div>

</div>



<script>

    /*
    =====================================================
    CONFIGURATION
    =====================================================
    */

    const API_URL =
        "https://menu-cantine.clement-caron-butgeii.workers.dev";


    const restaurantsInfo = {

        "4704": {
            nom: "4704 (en face)"
        },

        "4503": {
            nom: "4503 (DM)"
        }

    };


    const categories = [

        {
            titre: "Entrées",
            cle: "entrees"
        },

        {
            titre: "Plats principaux",
            cle: "plats"
        },

        {
            titre: "Desserts",
            cle: "desserts"
        }

    ];



    /*
    =====================================================
    DATE DU JOUR
    =====================================================
    */

    function dateAujourdHuiISO() {

        const maintenant =
            new Date();


        const annee =
            maintenant.getFullYear();


        const mois =
            String(
                maintenant.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const jour =
            String(
                maintenant.getDate()
            ).padStart(
                2,
                "0"
            );


        return `${annee}-${mois}-${jour}`;

    }


    const AUJOURD_HUI =
        dateAujourdHuiISO();


    let dateSelectionnee =
        AUJOURD_HUI;


    let moisCalendrier;


    let modeVersionsMultiples =
        false;



    /*
    =====================================================
    OUTILS DE DATE
    =====================================================
    */

    function creerDateISO(
        annee,
        mois,
        jour
    ) {

        return (
            annee
            +
            "-"
            +
            String(
                mois + 1
            ).padStart(2, "0")
            +
            "-"
            +
            String(
                jour
            ).padStart(2, "0")
        );

    }



    function dateISOversDate(
        valeur
    ) {

        const [
            annee,
            mois,
            jour
        ] =
            valeur
                .split("-")
                .map(Number);


        return new Date(
            annee,
            mois - 1,
            jour
        );

    }



    function afficherDateSelectionnee(
        dateISO
    ) {

        const date =
            dateISOversDate(
                dateISO
            );


        document.querySelector(
            "#date-affichee"
        ).textContent =
            new Intl.DateTimeFormat(
                "fr-FR",
                {
                    weekday: "long",
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            )
            .format(date);

    }



    function mettreAJourBoutonsDate() {

        const boutonSuivant =
            document.querySelector(
                "#date-suivante"
            );


        boutonSuivant.disabled =
            dateSelectionnee >= AUJOURD_HUI;

    }



    function changerDateSelectionnee(
        nombreJours
    ) {

        const date =
            dateISOversDate(
                dateSelectionnee
            );


        date.setDate(
            date.getDate() + nombreJours
        );


        const nouvelleDate =
            creerDateISO(
                date.getFullYear(),
                date.getMonth(),
                date.getDate()
            );


        if (
            nouvelleDate > AUJOURD_HUI
        ) {

            return;

        }


        dateSelectionnee =
            nouvelleDate;


        afficherDateSelectionnee(
            nouvelleDate
        );


        mettreAJourBoutonsDate();


        fermerCalendrier();


        chargerMenus(
            nouvelleDate
        );

    }



    /*
    =====================================================
    CALENDRIER
    =====================================================
    */

    function initialiserCalendrier() {

        afficherDateSelectionnee(
            AUJOURD_HUI
        );


        mettreAJourBoutonsDate();


        moisCalendrier =
            dateISOversDate(
                AUJOURD_HUI
            );


        moisCalendrier.setDate(1);


        const zoneDate =
            document.querySelector(
                "#date-selection"
            );


        const boutonDatePrecedente =
            document.querySelector(
                "#date-precedente"
            );


        const boutonDateSuivante =
            document.querySelector(
                "#date-suivante"
            );


        const calendrier =
            document.querySelector(
                "#calendrier"
            );


        boutonDatePrecedente.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                changerDateSelectionnee(
                    -1
                );

            }
        );


        boutonDateSuivante.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                if (this.disabled) {
                    return;
                }


                changerDateSelectionnee(
                    1
                );

            }
        );


        zoneDate.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                if (
                    calendrier.classList.contains(
                        "ouvert"
                    )
                ) {

                    fermerCalendrier();

                }

                else {

                    ouvrirCalendrier();

                }

            }
        );


        document.querySelector(
            "#mois-precedent"
        )
        .addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                moisCalendrier.setMonth(
                    moisCalendrier.getMonth() - 1
                );


                dessinerCalendrier();

            }
        );


        document.querySelector(
            "#mois-suivant"
        )
        .addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                if (this.disabled) {
                    return;
                }


                moisCalendrier.setMonth(
                    moisCalendrier.getMonth() + 1
                );


                dessinerCalendrier();

            }
        );


        document.addEventListener(
            "click",
            function (event) {

                if (
                    !calendrier.contains(
                        event.target
                    )
                    &&
                    !zoneDate.contains(
                        event.target
                    )
                ) {

                    fermerCalendrier();

                }

            }
        );


        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape"
                ) {

                    fermerCalendrier();

                }

            }
        );


        window.addEventListener(
            "resize",
            function () {

                if (
                    calendrier.classList.contains(
                        "ouvert"
                    )
                ) {

                    positionnerCalendrier();

                }


                ajusterLargeurColonnes();

            }
        );

    }



    function ouvrirCalendrier() {

        moisCalendrier =
            dateISOversDate(
                dateSelectionnee
            );


        moisCalendrier.setDate(1);


        dessinerCalendrier();


        const calendrier =
            document.querySelector(
                "#calendrier"
            );


        calendrier.classList.add(
            "ouvert"
        );


        calendrier.setAttribute(
            "aria-hidden",
            "false"
        );


        positionnerCalendrier();

    }



    function fermerCalendrier() {

        const calendrier =
            document.querySelector(
                "#calendrier"
            );


        calendrier.classList.remove(
            "ouvert"
        );


        calendrier.setAttribute(
            "aria-hidden",
            "true"
        );

    }



    function positionnerCalendrier() {

        const zoneDate =
            document.querySelector(
                "#date-selection"
            );


        const calendrier =
            document.querySelector(
                "#calendrier"
            );


        const rect =
            zoneDate.getBoundingClientRect();


        const largeur =
            calendrier.offsetWidth;


        let gauche =
            rect.left
            +
            rect.width / 2
            -
            largeur / 2;


        gauche =
            Math.max(
                10,
                Math.min(
                    gauche,
                    window.innerWidth
                    -
                    largeur
                    -
                    10
                )
            );


        calendrier.style.left =
            `${gauche}px`;


        calendrier.style.top =
            `${rect.bottom + 8}px`;

    }



    function dessinerCalendrier() {

        const zone =
            document.querySelector(
                "#jours-calendrier"
            );


        const titre =
            document.querySelector(
                "#titre-mois"
            );


        const suivant =
            document.querySelector(
                "#mois-suivant"
            );


        zone.innerHTML = "";


        const annee =
            moisCalendrier.getFullYear();


        const mois =
            moisCalendrier.getMonth();


        titre.textContent =
            new Intl.DateTimeFormat(
                "fr-FR",
                {
                    month: "long",
                    year: "numeric"
                }
            )
            .format(
                moisCalendrier
            );


        const premierJour =
            (
                new Date(
                    annee,
                    mois,
                    1
                ).getDay()
                +
                6
            )
            %
            7;


        const nombreJours =
            new Date(
                annee,
                mois + 1,
                0
            ).getDate();


        for (
            let i = 0;
            i < premierJour;
            i++
        ) {

            const vide =
                document.createElement(
                    "div"
                );


            vide.className =
                "jour-vide";


            zone.appendChild(
                vide
            );

        }


        for (
            let jour = 1;
            jour <= nombreJours;
            jour++
        ) {

            const valeurDate =
                creerDateISO(
                    annee,
                    mois,
                    jour
                );


            const bouton =
                document.createElement(
                    "button"
                );


            bouton.type =
                "button";


            bouton.className =
                "jour-calendrier";


            bouton.textContent =
                jour;


            const dateJour =
                new Date(
                    annee,
                    mois,
                    jour
                );


            if (
                dateJour.getDay() === 0
                ||
                dateJour.getDay() === 6
            ) {

                bouton.classList.add(
                    "weekend"
                );

            }


            if (
                valeurDate ===
                dateSelectionnee
            ) {

                bouton.classList.add(
                    "selectionne"
                );

            }


            if (
                valeurDate ===
                AUJOURD_HUI
            ) {

                bouton.classList.add(
                    "aujourdhui"
                );

            }


            if (
                valeurDate >
                AUJOURD_HUI
            ) {

                bouton.disabled =
                    true;


                bouton.classList.add(
                    "futur"
                );

            }

            else {

                bouton.addEventListener(
                    "click",
                    function (event) {

                        event.stopPropagation();


                        dateSelectionnee =
                            valeurDate;


                        afficherDateSelectionnee(
                            valeurDate
                        );


                        mettreAJourBoutonsDate();


                        fermerCalendrier();


                        chargerMenus(
                            valeurDate
                        );

                    }
                );

            }


            zone.appendChild(
                bouton
            );

        }


        const aujourdHui =
            dateISOversDate(
                AUJOURD_HUI
            );


        suivant.disabled =
            (
                annee >
                aujourdHui.getFullYear()
            )
            ||
            (
                annee ===
                aujourdHui.getFullYear()
                &&
                mois >=
                aujourdHui.getMonth()
            );

    }



    /*
    =====================================================
    CHARGEMENT DES DONNÉES
    =====================================================
    */

    async function chargerMenus(
        dateISO = AUJOURD_HUI
    ) {

        const chargement =
            document.querySelector(
                "#chargement"
            );


        const menus =
            document.querySelector(
                "#menus"
            );


        const restaurants =
            document.querySelector(
                "#restaurants"
            );


        const historiqueDemande =
            dateISO !== AUJOURD_HUI;


        chargement.style.display =
            "block";


        chargement.classList.remove(
            "erreur"
        );


        chargement.textContent =
            historiqueDemande
                ? "Chargement de l'historique..."
                : "Chargement des menus...";


        menus.innerHTML = "";
        restaurants.innerHTML = "";


        try {

            const url =
                new URL(
                    API_URL
                );


            if (
                historiqueDemande
            ) {

                url.searchParams.set(
                    "date",
                    dateISO
                );

            }


            const response =
                await fetch(
                    url.toString(),
                    {
                        cache:
                            "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Erreur HTTP ${response.status}`
                );

            }


            const donnees =
                await response.json();



            /*
            =================================================
            HISTORIQUE
            =================================================
            */

            if (
                historiqueDemande
            ) {

                if (
                    donnees.historique !== true
                    ||
                    donnees.dateDemandee !== dateISO
                    ||
                    !donnees.versions
                ) {

                    afficherComparaison(

                        [
                            creerMenuIndisponible(
                                "4704",
                                "Aucun menu enregistré"
                            )
                        ],

                        [
                            creerMenuIndisponible(
                                "4503",
                                "Aucun menu enregistré"
                            )
                        ]

                    );


                    chargement.style.display =
                        "none";


                    return;

                }


                let versions4704 =
                    Array.isArray(
                        donnees.versions["4704"]
                    )
                        ? donnees.versions["4704"]
                        : [];


                let versions4503 =
                    Array.isArray(
                        donnees.versions["4503"]
                    )
                        ? donnees.versions["4503"]
                        : [];


                if (
                    versions4704.length === 0
                ) {

                    versions4704 = [

                        creerMenuIndisponible(
                            "4704",
                            "Aucun menu enregistré"
                        )

                    ];

                }


                if (
                    versions4503.length === 0
                ) {

                    versions4503 = [

                        creerMenuIndisponible(
                            "4503",
                            "Aucun menu enregistré"
                        )

                    ];

                }


                afficherComparaison(
                    versions4704,
                    versions4503
                );

            }



            /*
            =================================================
            MENU ACTUEL
            =================================================
            */

            else {

                const menu4704 =
                    donnees["4704"]
                    ||
                    creerMenuIndisponible(
                        "4704",
                        "Menu non disponible"
                    );


                const menu4503 =
                    donnees["4503"]
                    ||
                    creerMenuIndisponible(
                        "4503",
                        "Menu non disponible"
                    );


                afficherComparaison(
                    [menu4704],
                    [menu4503]
                );

            }


            chargement.style.display =
                "none";

        }

        catch (erreur) {

            console.error(
                erreur
            );


            chargement.textContent =
                historiqueDemande
                    ? "Impossible de charger l'historique."
                    : "Impossible de charger les menus.";


            chargement.classList.add(
                "erreur"
            );

        }

    }



    /*
    =====================================================
    AFFICHAGE GLOBAL
    =====================================================
    */

    function afficherComparaison(
        versions4704,
        versions4503
    ) {

        modeVersionsMultiples =
            versions4704.length > 1
            ||
            versions4503.length > 1;


        const colonnes = [];


        versions4704.forEach(
            (
                menu,
                index
            ) => {

                colonnes.push({

                    restaurant:
                        "4704",

                    menu:
                        menu,

                    nombreVersions:
                        versions4704.length,

                    numeroVersion:
                        index + 1,

                    finGroupe:
                        index ===
                        versions4704.length - 1

                });

            }
        );


        versions4503.forEach(
            (
                menu,
                index
            ) => {

                colonnes.push({

                    restaurant:
                        "4503",

                    menu:
                        menu,

                    nombreVersions:
                        versions4503.length,

                    numeroVersion:
                        index + 1,

                    finGroupe:
                        false

                });

            }
        );


        const tableInner =
            document.querySelector(
                "#table-inner"
            );


        tableInner.style.setProperty(
            "--nb-cols",
            colonnes.length
        );


        tableInner.classList.toggle(
            "multiple",
            modeVersionsMultiples
        );


        afficherEntetes(
            versions4704,
            versions4503
        );


        afficherMenus(
            colonnes
        );


        requestAnimationFrame(
            ajusterLargeurColonnes
        );

    }



    /*
    =====================================================
    EN-TÊTES
    =====================================================
    */

    function afficherEntetes(
        versions4704,
        versions4503
    ) {

        const zone =
            document.querySelector(
                "#restaurants"
            );


        zone.innerHTML = "";


        /*
        =================================================
        UNE SEULE VERSION PAR CANTINE

        Affichage strictement comme avant.
        =================================================
        */

        if (
            !modeVersionsMultiples
        ) {

            zone.className =
                "restaurants mode-simple";


            zone.appendChild(
                creerEnteteSimple(
                    "4704",
                    versions4704[0]
                )
            );


            zone.appendChild(
                creerEnteteSimple(
                    "4503",
                    versions4503[0]
                )
            );


            return;

        }



        /*
        =================================================
        PLUSIEURS VERSIONS
        =================================================
        */

        zone.className =
            "restaurants mode-multiple";


        const groupes =
            document.createElement(
                "div"
            );


        groupes.className =
            "groupes-restaurants";


        const groupe4704 =
            creerGroupeRestaurant(
                "4704",
                versions4704.length
            );


        const groupe4503 =
            creerGroupeRestaurant(
                "4503",
                versions4503.length
            );


        groupes.appendChild(
            groupe4704
        );


        groupes.appendChild(
            groupe4503
        );


        zone.appendChild(
            groupes
        );



        const versions =
            document.createElement(
                "div"
            );


        versions.className =
            "versions-entetes";


        versions4704.forEach(
            (
                menu,
                index
            ) => {

                const entete =
                    creerEnteteVersion(
                        "4704",
                        menu,
                        index + 1,
                        versions4704.length
                    );


                if (
                    index ===
                    versions4704.length - 1
                ) {

                    entete.classList.add(
                        "fin-groupe"
                    );

                }


                versions.appendChild(
                    entete
                );

            }
        );


        versions4503.forEach(
            (
                menu,
                index
            ) => {

                versions.appendChild(

                    creerEnteteVersion(
                        "4503",
                        menu,
                        index + 1,
                        versions4503.length
                    )

                );

            }
        );


        zone.appendChild(
            versions
        );

    }



    function creerGroupeRestaurant(
        restaurant,
        nombreColonnes
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            `groupe-restaurant restaurant-${restaurant}`;


        element.style.gridColumn =
            `span ${nombreColonnes}`;


        element.textContent =
            restaurantsInfo[
                restaurant
            ].nom;


        return element;

    }



    /*
    =====================================================
    EN-TÊTE SIMPLE
    =====================================================
    */

    function creerEnteteSimple(
        restaurant,
        menu
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            `restaurant restaurant-${restaurant}`;


        const nom =
            document.createElement(
                "div"
            );


        nom.className =
            "numero-restaurant";


        nom.textContent =
            restaurantsInfo[
                restaurant
            ].nom;


        element.appendChild(
            nom
        );


        ajouterInformationsVersion(
            element,
            menu,
            false
        );


        return element;

    }



    /*
    =====================================================
    EN-TÊTE VERSION
    =====================================================
    */

    function creerEnteteVersion(
        restaurant,
        menu,
        numeroVersion,
        nombreVersions
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            `version-entete restaurant-${restaurant}`;


        const heure =
            extraireHeureMiseAJour(
                menu
            );


        const titre =
            document.createElement(
                "div"
            );


        titre.className =
            "heure-version";


        if (heure) {

            titre.textContent =
                `Mis à jour : ${heure}`;

        }

        else {

            titre.textContent =
                nombreVersions > 1
                    ? `Version ${numeroVersion}`
                    : "Menu";

        }


        element.appendChild(
            titre
        );


        ajouterInformationsVersion(
            element,
            menu,
            true
        );


        return element;

    }



    /*
    =====================================================
    INFORMATIONS D'UNE VERSION
    =====================================================
    */

    function ajouterInformationsVersion(
        element,
        menu,
        versionMultiple
    ) {

        if (
            !versionMultiple
            &&
            menu.disponible !== false
            &&
            menu.miseAJour
        ) {

            const miseAJour =
                document.createElement(
                    "div"
                );


            miseAJour.className =
                "mise-a-jour visible";


            miseAJour.textContent =
                `Mis à jour : ${extraireHeureMiseAJour(menu) || menu.miseAJour}`;


            element.appendChild(
                miseAJour
            );

        }



        if (
            menu.disponible !== false
        ) {

            const moyennePlats =
                calculerPrixMoyen(
                    menu.plats || []
                );


            const moyenneDesserts =
                calculerPrixMoyen(
                    menu.desserts || []
                );


            if (
                moyennePlats !== null
                ||
                moyenneDesserts !== null
            ) {

                const moyennes =
                    document.createElement(
                        "div"
                    );


                moyennes.className =
                    "moyennes-prix visible";


                if (
                    moyennePlats !== null
                ) {

                    const ligne =
                        document.createElement(
                            "div"
                        );


                    ligne.className =
                        "moyenne-prix";


                    ligne.textContent =
                        `Plat moyen : ${formaterPrix(moyennePlats)}`;


                    moyennes.appendChild(
                        ligne
                    );

                }


                if (
                    moyenneDesserts !== null
                ) {

                    const ligne =
                        document.createElement(
                            "div"
                        );


                    ligne.className =
                        "moyenne-prix";


                    ligne.textContent =
                        `Dessert moyen : ${formaterPrix(moyenneDesserts)}`;


                    moyennes.appendChild(
                        ligne
                    );

                }


                element.appendChild(
                    moyennes
                );

            }

        }



        /*
        Ancien menu sauvegardé à 13h.
        */

        if (
            menu.sauvegardeForcee === true
            &&
            menu.dateSourceISO
            &&
            menu.dateSourceISO !==
            dateSelectionnee
        ) {

            const source =
                document.createElement(
                    "div"
                );


            source.className =
                "date-source";


            source.textContent =
                `Menu daté du ${formaterDateCourte(menu.dateSourceISO)}`;


            element.appendChild(
                source
            );

        }



        if (
            menu.disponible === false
        ) {

            const statut =
                document.createElement(
                    "div"
                );


            statut.className =
                "statut-menu visible";


            statut.textContent =
                menu.message
                ||
                "Menu non disponible";


            element.appendChild(
                statut
            );

        }

    }



    /*
    =====================================================
    MENUS
    =====================================================
    */

    function afficherMenus(
        colonnes
    ) {

        const zoneMenus =
            document.querySelector(
                "#menus"
            );


        zoneMenus.innerHTML = "";


        const auMoinsUnMenu =
            colonnes.some(
                colonne =>
                    colonne.menu.disponible === true
            );


        if (
            !auMoinsUnMenu
        ) {

            const message =
                document.createElement(
                    "div"
                );


            message.className =
                "message-global";


            message.textContent =
                dateSelectionnee === AUJOURD_HUI
                    ? "Aucun menu n'est disponible pour le moment."
                    : "Aucun menu enregistré pour cette date.";


            zoneMenus.appendChild(
                message
            );


            return;

        }



        categories.forEach(
            categorie => {

                const listes =
                    colonnes.map(
                        colonne => {

                            if (
                                colonne.menu.disponible === false
                            ) {

                                return [];

                            }


                            return (
                                colonne.menu[
                                    categorie.cle
                                ]
                                ||
                                []
                            );

                        }
                    );


                const produitsPrixDifferents =
                    calculerProduitsPrixDifferentsEntreCantines(
                        colonnes,
                        categorie.cle
                    );


                const nombreLignes =
                    Math.max(
                        ...listes.map(
                            liste =>
                                liste.length
                        )
                    );


                if (
                    nombreLignes === 0
                ) {

                    return;

                }


                const section =
                    document.createElement(
                        "section"
                    );


                section.className =
                    "categorie-section";


                const titre =
                    document.createElement(
                        "h2"
                    );


                titre.className =
                    "categorie-titre";


                titre.textContent =
                    categorie.titre;


                section.appendChild(
                    titre
                );


                for (
                    let i = 0;
                    i < nombreLignes;
                    i++
                ) {

                    const ligne =
                        document.createElement(
                            "div"
                        );


                    ligne.className =
                        "ligne-plat";


                    colonnes.forEach(
                        (
                            colonne,
                            index
                        ) => {

                            const plat =
                                listes[
                                    index
                                ][i];


                            const cellule =
                                creerPlat(
                                    plat,
                                    colonne.restaurant,
                                    Boolean(
                                        plat
                                        &&
                                        produitsPrixDifferents.has(
                                            normaliserNomPourComparaisonPrix(
                                                plat.nom
                                            )
                                        )
                                    )
                                );


                            if (
                                colonne.finGroupe
                                &&
                                modeVersionsMultiples
                            ) {

                                cellule.classList.add(
                                    "fin-groupe"
                                );

                            }


                            ligne.appendChild(
                                cellule
                            );

                        }
                    );


                    section.appendChild(
                        ligne
                    );

                }


                zoneMenus.appendChild(
                    section
                );

            }
        );

    }



    function creerPlat(
        plat,
        restaurant,
        prixDifferentCantines = false
    ) {

        const element =
            document.createElement(
                "article"
            );


        element.className =
            `plat restaurant-${restaurant}`;


        if (!plat) {

            element.classList.add(
                "plat-vide"
            );


            return element;

        }


        const nom =
            document.createElement(
                "div"
            );


        nom.className =
            "nom";


        nom.textContent =
            plat.nom;

        const seriePresence =
            Number(
                plat.seriePresence
            );

        if (
            Number.isFinite(
                seriePresence
            )
            &&
            seriePresence >= 2
        ) {

            const repetition =
                document.createElement(
                    "span"
                );


            repetition.className =
                "repetition-presence";


            const fleche =
                document.createElement(
                    "span"
                );


            fleche.className =
                "repetition-fleche";


            fleche.textContent =
                "↻";


            const exposant =
                document.createElement(
                    "sup"
                );


            exposant.textContent =
                seriePresence > 9
                    ? "9+"
                    : seriePresence;


            repetition.appendChild(
                fleche
            );


            repetition.appendChild(
                exposant
            );


            repetition.title =
                `Présent ${seriePresence} jours de cantine consécutifs`;


            nom.appendChild(
                repetition
            );

        }


        const prix =
            document.createElement(
                "div"
            );


        prix.className =
            "prix";


        prix.appendChild(
            document.createTextNode(
                plat.prix || ""
            )
        );


        if (
            plat.variation === "hausse"
            ||
            plat.variation === "baisse"
        ) {

            if (
                plat.comparaisonAutreCantine === true
            ) {

                const avertissement =
                    document.createElement(
                        "span"
                    );


                avertissement.className =
                    "avertissement-comparaison";


                avertissement.textContent =
                    "⚠";


                avertissement.title =
                    creerTitreComparaisonPrix(
                        plat,
                        restaurant,
                        true
                    );


                prix.appendChild(
                    avertissement
                );

            }


            const variation =
                document.createElement(
                    "span"
                );


            variation.className =
                `variation-prix ${plat.variation}`;


            variation.textContent =
                plat.variation === "hausse"
                    ? "↑"
                    : "↓";


            variation.title =
                creerTitreComparaisonPrix(
                    plat,
                    restaurant,
                    plat.comparaisonAutreCantine === true
                );


            prix.appendChild(
                variation
            );

        }


        if (
            prixDifferentCantines
        ) {

            const difference =
                document.createElement(
                    "span"
                );


            difference.className =
                "difference-cantines";


            difference.textContent =
                "≠";


            difference.title =
                "Prix différent entre les deux cantines pour ce produit à cette date";


            prix.appendChild(
                difference
            );

        }


        element.appendChild(
            nom
        );


        element.appendChild(
            prix
        );


        return element;

    }



    function creerTitreComparaisonPrix(
        plat,
        restaurant,
        autreCantine
    ) {

        const prixPrecedent =
            Number(
                plat.prixPrecedent
            );


        const prixTexte =
            Number.isFinite(
                prixPrecedent
            )
                ? formaterPrix(
                    prixPrecedent
                )
                : "prix précédent inconnu";


        const dateTexte =
            plat.dateReference
                ? ` le ${formaterDateCourte(plat.dateReference)}`
                : "";


        if (
            autreCantine
        ) {

            const restaurantReference =
                plat.restaurantReference
                ||
                (restaurant === "4704" ? "4503" : "4704");


            return (
                `Comparé au dernier prix connu au ${restaurantReference} : `
                +
                `${prixTexte}${dateTexte}`
            );

        }


        return (
            `Prix précédent dans cette cantine : `
            +
            `${prixTexte}${dateTexte}`
        );

    }



    function calculerProduitsPrixDifferentsEntreCantines(
        colonnes,
        categorieCle
    ) {

        const produits =
            new Map();


        colonnes.forEach(
            colonne => {

                if (
                    !colonne.menu
                    ||
                    colonne.menu.disponible === false
                ) {
                    return;
                }


                const liste =
                    colonne.menu[
                        categorieCle
                    ]
                    ||
                    [];


                liste.forEach(
                    element => {

                        const prix =
                            convertirPrix(
                                element.prix
                            );


                        if (
                            !Number.isFinite(
                                prix
                            )
                        ) {
                            return;
                        }


                        const cle =
                            normaliserNomPourComparaisonPrix(
                                element.nom
                            );


                        if (!cle) {
                            return;
                        }


                        if (
                            !produits.has(
                                cle
                            )
                        ) {

                            produits.set(
                                cle,
                                {
                                    "4704": new Set(),
                                    "4503": new Set()
                                }
                            );

                        }


                        produits.get(
                            cle
                        )[
                            colonne.restaurant
                        ].add(
                            prix.toFixed(4)
                        );

                    }
                );

            }
        );


        const differences =
            new Set();


        produits.forEach(
            (
                valeurs,
                cle
            ) => {

                if (
                    valeurs["4704"].size === 0
                    ||
                    valeurs["4503"].size === 0
                ) {
                    return;
                }


                let differenceTrouvee =
                    false;


                for (
                    const prix4704
                    of valeurs["4704"]
                ) {

                    for (
                        const prix4503
                        of valeurs["4503"]
                    ) {

                        if (
                            Math.abs(
                                Number(prix4704)
                                -
                                Number(prix4503)
                            )
                            >
                            0.0001
                        ) {

                            differenceTrouvee =
                                true;

                            break;

                        }

                    }


                    if (
                        differenceTrouvee
                    ) {
                        break;
                    }

                }


                if (
                    differenceTrouvee
                ) {

                    differences.add(
                        cle
                    );

                }

            }
        );


        return differences;

    }



    function normaliserNomPourComparaisonPrix(
        texte
    ) {

        return String(
            texte
            ||
            ""
        )

            .normalize(
                "NFD"
            )

            .replace(
                /[\u0300-\u036f]/g,
                ""
            )

            .replace(
                /[’`]/g,
                "'"
            )

            .toLowerCase()

            .replace(
                /\s+/g,
                " "
            )

            .trim();

    }



    /*
    =====================================================
    PRIX
    =====================================================
    */

    function calculerPrixMoyen(
        elements
    ) {

        const prix =
            elements

                .map(
                    element =>
                        convertirPrix(
                            element.prix
                        )
                )

                .filter(
                    valeur =>
                        Number.isFinite(
                            valeur
                        )
                );


        if (
            prix.length === 0
        ) {

            return null;

        }


        const total =
            prix.reduce(
                (
                    somme,
                    valeur
                ) =>
                    somme + valeur,
                0
            );


        return (
            total /
            prix.length
        );

    }



    function convertirPrix(
        prix
    ) {

        if (!prix) {
            return NaN;
        }


        const resultat =
            String(prix)
                .replace(
                    /\u00a0/g,
                    " "
                )
                .match(
                    /[0-9]+(?:[.,][0-9]+)?/
                );


        if (!resultat) {
            return NaN;
        }


        return parseFloat(
            resultat[0]
                .replace(
                    ",",
                    "."
                )
        );

    }



    function formaterPrix(
        prix
    ) {

        return new Intl.NumberFormat(
            "fr-FR",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        ).format(prix)
        +
        " €";

    }



    /*
    =====================================================
    AUTRES OUTILS
    =====================================================
    */

    function extraireHeureMiseAJour(
        menu
    ) {

        if (
            !menu
            ||
            !menu.miseAJour
        ) {

            return "";

        }


        const resultat =
            String(
                menu.miseAJour
            )
            .match(
                /([0-2]?\d:[0-5]\d)/
            );


        return resultat
            ? resultat[1]
            : "";

    }



    function formaterDateCourte(
        dateISO
    ) {

        const [
            annee,
            mois,
            jour
        ] =
            dateISO
                .split("-");


        return (
            `${jour}/${mois}/${annee}`
        );

    }



    function creerMenuIndisponible(
        restaurant,
        message
    ) {

        return {

            restaurant:
                restaurant,

            disponible:
                false,

            message:
                message,

            date:
                "",

            miseAJour:
                "",

            entrees:
                [],

            plats:
                [],

            desserts:
                []

        };

    }



    /*
    =====================================================
    LARGEUR DES COLONNES
    =====================================================
    */

    function ajusterLargeurColonnes() {

        const tableInner =
            document.querySelector(
                "#table-inner"
            );


        /*
        Deux colonnes classiques sur mobile :
        50 / 50 comme avant.
        */

        if (
            window.innerWidth <= 600
            &&
            !modeVersionsMultiples
        ) {

            tableInner.style.removeProperty(
                "--col-size"
            );


            return;

        }


        let largeurMax =
            0;



        function mesurerTexte(
            element
        ) {

            if (
                !element
                ||
                !element.textContent.trim()
            ) {

                return 0;

            }


            const style =
                window.getComputedStyle(
                    element
                );


            const mesure =
                document.createElement(
                    "span"
                );


            mesure.textContent =
                element.textContent;


            mesure.style.position =
                "absolute";


            mesure.style.visibility =
                "hidden";


            mesure.style.whiteSpace =
                "nowrap";


            mesure.style.font =
                style.font;


            mesure.style.fontWeight =
                style.fontWeight;


            mesure.style.fontSize =
                style.fontSize;


            mesure.style.fontFamily =
                style.fontFamily;


            document.body.appendChild(
                mesure
            );


            const largeur =
                mesure.getBoundingClientRect()
                    .width;


            mesure.remove();


            return largeur;

        }



        document.querySelectorAll(
            ".nom, .prix, .numero-restaurant, .mise-a-jour, .moyenne-prix, .heure-version"
        )
        .forEach(
            element => {

                largeurMax =
                    Math.max(
                        largeurMax,
                        mesurerTexte(
                            element
                        )
                    );

            }
        );


        let largeurFinale =
            Math.max(
                Math.ceil(
                    largeurMax
                )
                +
                36,
                180
            );


        /*
        Avec plusieurs versions sur téléphone,
        on limite la taille des colonnes et
        on permet le défilement horizontal.
        */

        if (
            window.innerWidth <= 600
            &&
            modeVersionsMultiples
        ) {

            largeurFinale =
                Math.max(
                    165,
                    Math.min(
                        largeurFinale,
                        220
                    )
                );

        }


        tableInner.style.setProperty(
            "--col-size",
            `${largeurFinale}px`
        );

    }



    /*
    =====================================================
    DÉMARRAGE
    =====================================================
    */

    initialiserCalendrier();


    chargerMenus(
        AUJOURD_HUI
    );

</script>
