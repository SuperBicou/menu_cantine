<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Comparateur des menus</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">


    <!-- =============================
         EN-TÊTE
    ============================== -->

    <header class="page-header">

        <h1>
            Menus du jour
        </h1>

        <div
            id="date"
            class="date"
        ></div>

    </header>



    <!-- =============================
         RESTAURANTS
    ============================== -->

    <div class="restaurants">


        <div
            class="restaurant restaurant-4704"
        >

            <div class="numero-restaurant">
                4704 (en face)
            </div>

            <div
                id="statut-4704"
                class="statut-menu"
            ></div>

        </div>



        <div
            class="restaurant restaurant-4503"
        >

            <div class="numero-restaurant">
                4503 (DM)
            </div>

            <div
                id="statut-4503"
                class="statut-menu"
            ></div>

        </div>


    </div>



    <!-- =============================
         CHARGEMENT
    ============================== -->

    <div id="chargement">

        Chargement des menus...

    </div>



    <!-- =============================
         MENUS
    ============================== -->

    <main id="menus"></main>


</div>



<script>

    /*
    =====================================================
    WORKER
    =====================================================
    */

    const API_URL =
        "https://gentle-unit-6457.clement-caron-butgeii.workers.dev";



    /*
    =====================================================
    CATÉGORIES
    =====================================================
    */

    const categories = [

        {
            titre: "Entrées",
            cle: "entrees"
        },

        {
            titre: "Plats principaux",
            cle: "plats"
        },

        {
            titre: "Desserts",
            cle: "desserts"
        }

    ];



    /*
    =====================================================
    CHARGEMENT
    =====================================================
    */

    async function chargerMenus() {

        const chargement =
            document.querySelector(
                "#chargement"
            );


        try {

            const response =
                await fetch(API_URL);


            if (!response.ok) {

                throw new Error(
                    `Erreur HTTP ${response.status}`
                );

            }


            const donnees =
                await response.json();



            /*
            =============================
            MENUS
            =============================
            */

            const menu4704 =
                donnees["4704"] ||
                creerMenuIndisponible("4704");


            const menu4503 =
                donnees["4503"] ||
                creerMenuIndisponible("4503");



            /*
            =============================
            STATUTS
            =============================
            */

            afficherStatut(
                "4704",
                menu4704
            );


            afficherStatut(
                "4503",
                menu4503
            );



            /*
            =============================
            DATE
            =============================
            */

            afficherDate(
                menu4704,
                menu4503
            );



            /*
            =============================
            MENUS
            =============================
            */

            afficherMenus(
                menu4704,
                menu4503
            );



            /*
            =============================
            LARGEUR
            =============================
            */

            ajusterLargeurColonnes();



            /*
            =============================
            FIN DU CHARGEMENT
            =============================
            */

            chargement.style.display =
                "none";

        }

        catch (erreur) {

            console.error(erreur);


            chargement.textContent =
                "Impossible de contacter le service des menus.";


            chargement.classList.add(
                "erreur"
            );

        }

    }



    /*
    =====================================================
    MENU DE SECOURS
    =====================================================
    */

    function creerMenuIndisponible(
        restaurant
    ) {

        return {

            restaurant: restaurant,

            disponible: false,

            message:
                "Menu non disponible",

            date: "",

            entrees: [],
            plats: [],
            desserts: []

        };

    }



    /*
    =====================================================
    STATUT DU RESTAURANT
    =====================================================
    */

    function afficherStatut(
        restaurant,
        menu
    ) {

        const element =
            document.querySelector(
                `#statut-${restaurant}`
            );


        if (
            menu.disponible === false
        ) {

            element.textContent =
                menu.message ||
                "Menu non disponible";


            element.classList.add(
                "visible"
            );

        }

        else {

            element.textContent =
                "";


            element.classList.remove(
                "visible"
            );

        }

    }



    /*
    =====================================================
    DATE
    =====================================================
    */

    function afficherDate(
        menu4704,
        menu4503
    ) {

        const date =
            (
                menu4704.disponible !== false
                &&
                menu4704.date
            )

            ? menu4704.date

            : (
                menu4503.disponible !== false
                ? menu4503.date
                : ""
            );


        document.querySelector(
            "#date"
        ).textContent =
            date;

    }



    /*
    =====================================================
    AFFICHAGE DES MENUS
    =====================================================
    */

    function afficherMenus(
        menu4704,
        menu4503
    ) {

        const zoneMenus =
            document.querySelector(
                "#menus"
            );


        zoneMenus.innerHTML =
            "";



        /*
        =============================
        AUCUN MENU DISPONIBLE
        =============================
        */

        if (
            menu4704.disponible === false
            &&
            menu4503.disponible === false
        ) {

            const message =
                document.createElement(
                    "div"
                );


            message.className =
                "message-global";


            message.textContent =
                "Aucun menu n'est disponible pour le moment.";


            zoneMenus.appendChild(
                message
            );


            return;

        }



        /*
        =============================
        CATÉGORIES
        =============================
        */

        categories.forEach(
            categorie => {


                const plats4704 =
                    menu4704.disponible === false

                    ? []

                    : (
                        menu4704[categorie.cle]
                        || []
                    );


                const plats4503 =
                    menu4503.disponible === false

                    ? []

                    : (
                        menu4503[categorie.cle]
                        || []
                    );



                const nombreLignes =
                    Math.max(
                        plats4704.length,
                        plats4503.length
                    );



                /*
                Catégorie vide
                des deux côtés.
                */

                if (
                    nombreLignes === 0
                ) {

                    return;

                }



                const section =
                    document.createElement(
                        "section"
                    );


                section.className =
                    "categorie-section";



                /*
                TITRE
                */

                const titre =
                    document.createElement(
                        "h2"
                    );


                titre.className =
                    "categorie-titre";


                titre.textContent =
                    categorie.titre;


                section.appendChild(
                    titre
                );



                /*
                LIGNES
                */

                const lignes =
                    document.createElement(
                        "div"
                    );


                lignes.className =
                    "lignes-plats";



                for (
                    let i = 0;
                    i < nombreLignes;
                    i++
                ) {

                    const ligne =
                        document.createElement(
                            "div"
                        );


                    ligne.className =
                        "ligne-plat";



                    ligne.appendChild(

                        creerPlat(
                            plats4704[i],
                            "4704"
                        )

                    );



                    ligne.appendChild(

                        creerPlat(
                            plats4503[i],
                            "4503"
                        )

                    );


                    lignes.appendChild(
                        ligne
                    );

                }


                section.appendChild(
                    lignes
                );


                zoneMenus.appendChild(
                    section
                );

            }
        );

    }



    /*
    =====================================================
    CRÉATION D'UN PLAT
    =====================================================
    */

    function creerPlat(
        plat,
        restaurant
    ) {

        const element =
            document.createElement(
                "article"
            );


        element.className =
            `plat restaurant-${restaurant}`;



        /*
        CASE VIDE
        */

        if (!plat) {

            element.classList.add(
                "plat-vide"
            );


            return element;

        }



        /*
        NOM
        */

        const nom =
            document.createElement(
                "div"
            );


        nom.className =
            "nom";


        nom.textContent =
            plat.nom;



        /*
        PRIX
        */

        const prix =
            document.createElement(
                "div"
            );


        prix.className =
            "prix";


        prix.textContent =
            plat.prix || "";



        element.appendChild(nom);

        element.appendChild(prix);


        return element;

    }



    /*
    =====================================================
    LARGEUR AUTOMATIQUE
    =====================================================
    */

    function ajusterLargeurColonnes() {


        /*
        MOBILE = 50 / 50
        */

        if (
            window.innerWidth <= 600
        ) {

            document.documentElement
                .style
                .removeProperty(
                    "--col-size"
                );


            return;

        }



        let largeurMax =
            0;



        document.querySelectorAll(
            ".plat:not(.plat-vide)"
        )
        .forEach(
            plat => {


                const nom =
                    plat.querySelector(
                        ".nom"
                    );


                const prix =
                    plat.querySelector(
                        ".prix"
                    );


                const largeurNom =
                    nom
                    ? nom.scrollWidth
                    : 0;


                const largeurPrix =
                    prix
                    ? prix.scrollWidth
                    : 0;


                largeurMax =
                    Math.max(

                        largeurMax,

                        largeurNom,

                        largeurPrix

                    );

            }
        );



        /*
        Si aucun menu n'est disponible,
        on conserve une taille correcte.
        */

        const marge =
            28;


        const largeurMinimum =
            150;


        const largeurFinale =
            Math.max(

                largeurMax + marge,

                largeurMinimum

            );



        document.documentElement
            .style
            .setProperty(

                "--col-size",

                `${largeurFinale}px`

            );

    }



    /*
    =====================================================
    REDIMENSIONNEMENT
    =====================================================
    */

    window.addEventListener(

        "resize",

        ajusterLargeurColonnes

    );



    /*
    =====================================================
    LANCEMENT
    =====================================================
    */

    chargerMenus();

</script>


</body>

</html>
